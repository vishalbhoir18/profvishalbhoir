<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #000; }
      canvas { display: block; }
    </style>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
    </script>
  </head>
  <body>
    <script type="module">
      /**
       * Disc-diffusion assay, rendered offline into the frame sequence used by
       * the home page. window.renderFrame(t) → webp data URL for t ∈ [0, 1].
       */
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      const params = new URLSearchParams(location.search);
      const W = +params.get("w") || 1600;
      const H = +params.get("h") || 900;
      const SS = +params.get("ss") || 1.5; // supersampling

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W * SS, H * SS);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.92;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      scene.fog = new THREE.Fog(0x000000, 13, 24);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.32;

      const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);

      // ── seeded rng ───────────────────────────────────────────
      let seed = 1337;
      const rng = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

      // ── floor & light ───────────────────────────────────────
      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(40, 96),
        new THREE.MeshStandardMaterial({ color: 0x09090b, roughness: 0.5, metalness: 0.0 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const key = new THREE.SpotLight(0xfff4e6, 210, 50, Math.PI / 10, 0.9, 1.4);
      key.position.set(5.5, 13, 3.5);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.bias = -0.0004;
      key.shadow.radius = 8;
      scene.add(key, key.target);

      const rim = new THREE.SpotLight(0x7dd3fc, 120, 50, Math.PI / 11, 1, 1.3);
      rim.position.set(-5, 8, -9);
      scene.add(rim, rim.target);

      const fill = new THREE.PointLight(0xa78bfa, 9, 25, 1.6);
      fill.position.set(-6, 2.5, -4);
      scene.add(fill);

      // ── dish ────────────────────────────────────────────────
      const R = 3.0;
      const BASE_H = 0.08;
      const AGAR_R = R - 0.06;
      const AGAR_H = 0.32;
      const AGAR_TOP = BASE_H + AGAR_H;

      const glass = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0,
        roughness: 0.035,
        transmission: 1,
        thickness: 0.12,
        ior: 1.5,
        transparent: true,
        specularIntensity: 1,
        clearcoat: 1,
        clearcoatRoughness: 0.03,
        envMapIntensity: 2.4,
        side: THREE.DoubleSide,
        attenuationColor: new THREE.Color(0xe0fbff),
        attenuationDistance: 3,
      });
      const base = new THREE.Mesh(new THREE.CylinderGeometry(R, R, BASE_H, 180), glass);
      base.position.y = BASE_H / 2;
      scene.add(base);

      const profile = [
        new THREE.Vector2(R - 0.05, BASE_H),
        new THREE.Vector2(R - 0.05, 0.86),
        new THREE.Vector2(R - 0.035, 0.885),
        new THREE.Vector2(R - 0.015, 0.885),
        new THREE.Vector2(R, 0.86),
        new THREE.Vector2(R, 0),
      ];
      const wall = new THREE.Mesh(new THREE.LatheGeometry(profile, 220), glass);
      wall.castShadow = false;
      scene.add(wall);

      // agar
      const S = 2048;
      const tex = document.createElement("canvas");
      tex.width = tex.height = S;
      const tctx = tex.getContext("2d");
      const agarTex = new THREE.CanvasTexture(tex);
      agarTex.colorSpace = THREE.SRGBColorSpace;
      agarTex.anisotropy = 8;

      const agarTop = new THREE.MeshPhysicalMaterial({
        map: agarTex,
        roughness: 0.4,
        clearcoat: 0.35,
        clearcoatRoughness: 0.3,
        envMapIntensity: 1.2,
      });
      const agarSide = new THREE.MeshStandardMaterial({
        color: 0xc98d3c,
        emissive: 0x3d2208,
        roughness: 0.25,
        transparent: true,
        opacity: 0.92,
      });
      const agar = new THREE.Mesh(new THREE.CylinderGeometry(AGAR_R, AGAR_R, AGAR_H, 180), [agarSide, agarTop, agarSide]);
      agar.position.y = BASE_H + AGAR_H / 2;
      agar.receiveShadow = true;
      scene.add(agar);

      // world (x,z) on the agar → canvas px (see CylinderGeometry cap UVs; flipY)
      const toCanvas = (x, z) => [((z / AGAR_R) * 0.5 + 0.5) * S, (0.5 - (x / AGAR_R) * 0.5) * S];
      const toPx = (r) => (r / AGAR_R) * 0.5 * S;

      // discs: [label, x, z, final zone radius]
      const ringR = 1.62;
      const discs = [
        ["FLC", 0, 0, 0.36],
        ["C1", ringR * Math.cos(0.785), ringR * Math.sin(0.785), 1.06],
        ["C2", ringR * Math.cos(2.356), ringR * Math.sin(2.356), 0.74],
        ["C3", ringR * Math.cos(3.927), ringR * Math.sin(3.927), 0.94],
        ["AmB", ringR * Math.cos(5.498), ringR * Math.sin(5.498), 0.86],
      ];
      const discMeshes = discs.map(([label, x, z], i) => {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const g = c.getContext("2d");
        g.fillStyle = "#f4f1ea";
        g.fillRect(0, 0, 256, 256);
        for (let k = 0; k < 2500; k++) {
          g.fillStyle = `rgba(0,0,0,${rng() * 0.05})`;
          g.fillRect(rng() * 256, rng() * 256, 2, 2);
        }
        g.fillStyle = "#2a2a2e";
        g.font = "600 64px Helvetica, Arial, sans-serif";
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillText(label, 128, 132);
        const top = new THREE.CanvasTexture(c);
        top.colorSpace = THREE.SRGBColorSpace;
        const side = new THREE.MeshStandardMaterial({ color: 0xeeeae2, roughness: 0.95 });
        const m = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.035, 64), [
          side,
          new THREE.MeshStandardMaterial({ map: top, roughness: 0.95 }),
          side,
        ]);
        m.position.set(x, AGAR_TOP + 0.0175, z);
        m.rotation.y = rng() * Math.PI * 2;
        m.castShadow = true;
        m.receiveShadow = true;
        scene.add(m);
        return m;
      });

      // ── textures: agar base + lawn (precomputed) ─────────────
      const agarBase = document.createElement("canvas");
      agarBase.width = agarBase.height = S;
      {
        const g = agarBase.getContext("2d");
        const grad = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
        grad.addColorStop(0, "#a8732f");
        grad.addColorStop(0.75, "#8c5a20");
        grad.addColorStop(0.97, "#5a3410");
        grad.addColorStop(1, "#3d2208");
        g.fillStyle = grad;
        g.fillRect(0, 0, S, S);
        for (let k = 0; k < 60000; k++) {
          g.fillStyle = `rgba(${rng() < 0.5 ? "255,230,190" : "60,30,5"},${rng() * 0.05})`;
          g.fillRect(rng() * S, rng() * S, 2, 2);
        }
      }
      const lawn = document.createElement("canvas");
      lawn.width = lawn.height = S;
      {
        const g = lawn.getContext("2d");
        g.save();
        g.beginPath();
        g.arc(S / 2, S / 2, S / 2 - 6, 0, Math.PI * 2);
        g.clip();
        g.fillStyle = "rgba(238,226,200,0.8)";
        g.fillRect(0, 0, S, S);
        // confluent micro-colonies
        for (let k = 0; k < 90000; k++) {
          const x = rng() * S;
          const y = rng() * S;
          const r = 1 + rng() * 3.2;
          const l = 225 + rng() * 30;
          g.fillStyle = `rgba(${l},${l - 8},${l - 26},${0.25 + rng() * 0.4})`;
          g.beginPath();
          g.arc(x, y, r, 0, Math.PI * 2);
          g.fill();
        }
        // faint swab streaks in three directions
        for (const ang of [0.2, 1.25, 2.3]) {
          g.save();
          g.translate(S / 2, S / 2);
          g.rotate(ang);
          for (let y = -S; y < S; y += 9 + rng() * 10) {
            g.strokeStyle = `rgba(${rng() < 0.5 ? "255,250,240" : "150,120,80"},${0.05 + rng() * 0.06})`;
            g.lineWidth = 2 + rng() * 5;
            g.beginPath();
            g.moveTo(-S, y);
            g.bezierCurveTo(-S / 3, y + (rng() - 0.5) * 20, S / 3, y + (rng() - 0.5) * 20, S, y);
            g.stroke();
          }
          g.restore();
        }
        // darker meniscus at the rim
        const ring = g.createRadialGradient(S / 2, S / 2, S * 0.42, S / 2, S / 2, S / 2);
        ring.addColorStop(0, "rgba(0,0,0,0)");
        ring.addColorStop(1, "rgba(80,50,20,0.35)");
        g.fillStyle = ring;
        g.fillRect(0, 0, S, S);
        g.restore();
      }
      // resistant breakthrough colonies inside zone of C2 (trailing growth)
      const breakthrough = Array.from({ length: 9 }, () => {
        const a = rng() * Math.PI * 2;
        const rr = 0.35 + rng() * 0.32;
        return [discs[2][1] + Math.cos(a) * rr, discs[2][2] + Math.sin(a) * rr, 0.025 + rng() * 0.03];
      });

      const work = document.createElement("canvas");
      work.width = work.height = S;
      const wctx = work.getContext("2d");

      const clamp01 = (v) => Math.min(1, Math.max(0, v));
      const smooth = (a, b, t) => {
        const x = clamp01((t - a) / (b - a));
        return x * x * (3 - 2 * x);
      };
      const easeOut = (x) => 1 - Math.pow(1 - x, 3);

      function paintAgar(t) {
        const growth = smooth(0.03, 0.3, t);
        tctx.globalCompositeOperation = "source-over";
        tctx.globalAlpha = 1;
        tctx.drawImage(agarBase, 0, 0);

        // lawn with zones punched out
        wctx.globalCompositeOperation = "source-over";
        wctx.clearRect(0, 0, S, S);
        wctx.drawImage(lawn, 0, 0);
        wctx.globalCompositeOperation = "destination-out";
        discs.forEach(([, x, z, zr], i) => {
          const p = easeOut(clamp01((t - 0.5 - i * 0.025) / 0.33));
          const r = 0.25 + (zr - 0.25) * p;
          if (p <= 0) return;
          const [cx, cy] = toCanvas(x, z);
          const rp = toPx(r);
          const edge = toPx(0.09);
          const grad = wctx.createRadialGradient(cx, cy, 0, cx, cy, rp + edge);
          grad.addColorStop(0, `rgba(0,0,0,${0.97 * p})`);
          grad.addColorStop(rp / (rp + edge), `rgba(0,0,0,${0.94 * p})`);
          grad.addColorStop(1, "rgba(0,0,0,0)");
          wctx.fillStyle = grad;
          wctx.beginPath();
          wctx.arc(cx, cy, rp + edge, 0, Math.PI * 2);
          wctx.fill();
        });
        wctx.globalCompositeOperation = "source-over";
        const bt = smooth(0.78, 0.92, t);
        if (bt > 0)
          breakthrough.forEach(([x, z, r]) => {
            const [cx, cy] = toCanvas(x, z);
            wctx.fillStyle = `rgba(250,244,228,${0.9 * bt})`;
            wctx.beginPath();
            wctx.arc(cx, cy, toPx(r) * bt, 0, Math.PI * 2);
            wctx.fill();
          });

        tctx.globalAlpha = growth;
        tctx.drawImage(work, 0, 0);
        tctx.globalAlpha = 1;
        agarTex.needsUpdate = true;
      }

      // ── camera path ─────────────────────────────────────────
      const sph = (d, polarDeg, azDeg) => {
        const p = THREE.MathUtils.degToRad(polarDeg);
        const a = THREE.MathUtils.degToRad(azDeg);
        return new THREE.Vector3(d * Math.sin(p) * Math.sin(a), d * Math.cos(p), d * Math.sin(p) * Math.cos(a));
      };
      const path = new THREE.CatmullRomCurve3(
        [sph(8.6, 77, -42), sph(9.8, 60, -24), sph(11.2, 40, -6), sph(12.6, 20, 10), sph(13.4, 3, 18)],
        false,
        "centripetal",
      );
      const look = new THREE.CatmullRomCurve3(
        [new THREE.Vector3(0, 0.55, 0.4), new THREE.Vector3(0, 0.45, 0.1), new THREE.Vector3(0, 0.4, 0), new THREE.Vector3(0, 0.4, 0), new THREE.Vector3(0, 0.4, 0)],
        false,
        "centripetal",
      );

      // ── composite (downsample + vignette) ───────────────────
      const out = document.createElement("canvas");
      out.width = W;
      out.height = H;
      const octx = out.getContext("2d");
      octx.imageSmoothingQuality = "high";

      window.renderFrame = (t) => {
        paintAgar(t);
        const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
        const u = 0.15 * t + 0.85 * ease(t);
        camera.position.copy(path.getPoint(u));
        camera.lookAt(look.getPoint(u));

        discMeshes.forEach((m, i) => {
          const start = 0.3 + i * 0.03;
          const p = clamp01((t - start) / 0.07);
          m.visible = p > 0;
          const fall = 1 - Math.pow(1 - p, 3);
          const bounce = p < 1 ? Math.sin(p * Math.PI) * 0.06 : 0;
          m.position.y = AGAR_TOP + 0.0175 + (1 - fall) * 2.6 + bounce * (1 - fall);
        });

        renderer.render(scene, camera);
        octx.fillStyle = "#000";
        octx.fillRect(0, 0, W, H);
        octx.drawImage(renderer.domElement, 0, 0, W, H);
        const v = octx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62);
        v.addColorStop(0, "rgba(0,0,0,0)");
        v.addColorStop(1, "rgba(0,0,0,0.85)");
        octx.fillStyle = v;
        octx.fillRect(0, 0, W, H);
        return out.toDataURL("image/webp", 0.8);
      };
      window.sceneReady = true;
    </script>
  </body>
</html>
